# One web service: Express + Socket.IO serves the API and the built web app over HTTPS.
services:
  - type: web
    name: wish-it
    runtime: node
    plan: free # sleeps after 15 min idle; no disk, so SQLite resets on restart or redeploy
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Production mode: strict rate limits, Socket.IO locked to PUBLIC_URL, generic 500s, and a boot
      # check that refuses to start without ADMIN_TOKEN and an https PUBLIC_URL.
      - key: NODE_ENV
        value: production
      # Daily caps on paid calls across all users (0 = no cap). Past a cap the app uses its free fallback.
      - key: DAILY_LLM_TURNS
        value: "1500"
      - key: DAILY_APIFY_SEARCHES
        value: "60"
      - key: DAILY_CARTESIA_TOKENS
        value: "600"
      - key: PUBLIC_URL
        sync: false
      - key: DEMO_MODE
        value: "0"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_ACTOR
        sync: false
